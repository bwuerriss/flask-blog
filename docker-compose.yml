version: '3.8'
services:
  web:
    build: .
    container_name: my-blog
    ports:
      - "5000:5000"
    volumes:
      - .:/app_dir
      - blog_data:/app_dir/instance
    environment:
      - FLASK_ENV=develoment
      - FLASK_APP=app.py
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    env_file:
    - .env
volumes:
  blog_data: